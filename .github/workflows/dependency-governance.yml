name: dependency-governance

on:
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '.github/dependency-governance.json'
      - '.github/dependency-recovery.json'
      - '.github/scripts/dependency-governance.mjs'
      - '.github/scripts/dependency-governance.selfcheck.mjs'
      - '.github/scripts/dependency-recovery-policy.mjs'
      - '.github/scripts/dependency-recovery-policy.selfcheck.mjs'
      - '.github/scripts/visual-baseline-trigger.selfcheck.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/dependency-governance.yml'
      - '.github/workflows/visual-baseline.yml'
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Open Dependabot pull request number to re-evaluate'
        required: true
        type: string
      allow-merge:
        description: 'Permit merge if every governance proof is satisfied'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dependency-governance-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || github.ref_name || github.run_id }}-${{ github.event_name == 'pull_request' && 'self-test' || 'reconcile' }}
  cancel-in-progress: false

env:
  GOVERNANCE_CONFIG: .github/dependency-governance.json
  RECOVERY_CONFIG: .github/dependency-recovery.json

jobs:
  self-test:
    name: governance-self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout proposed governance code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate governance configuration
        run: |
          node .github/scripts/dependency-governance.mjs --validate-config
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateRecoveryConfig } from './.github/scripts/dependency-recovery-policy.mjs';

          const config = JSON.parse(readFileSync('.github/dependency-recovery.json', 'utf8'));
          const errors = validateRecoveryConfig(config);
          if (errors.length > 0) {
            throw new Error(`Invalid dependency recovery config:\n- ${errors.join('\n- ')}`);
          }
          console.log('dependency-recovery config: valid');
          NODE
      - name: Exercise dependency-governance policy self-checks
        run: >-
          node --test
          .github/scripts/dependency-governance.selfcheck.mjs
          .github/scripts/dependency-recovery-policy.selfcheck.mjs
          .github/scripts/visual-baseline-trigger.selfcheck.mjs

  govern:
    name: govern-dependabot
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted default-branch governance code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Attempt bounded dependency recovery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { runDependencyRecovery } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/dependency-recovery-policy.mjs`
            );
            await runDependencyRecovery({
              github,
              context,
              core,
              allowRerun: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }},
            });
      - name: Reconcile dependency governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_MERGE: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || inputs.allow-merge }}
        run: node .github/scripts/dependency-governance.mjs
