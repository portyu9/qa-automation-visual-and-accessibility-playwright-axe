name: Format Bootstrap

on:
  push:
    branches: [bootstrap/quality-framework]

permissions:
  contents: write

env:
  NODE_VERSION: 24.20.0

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bootstrap/quality-framework
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply Prettier
        run: npm run format
      - name: Keep workflow files out of bot-authored formatting commit
        run: git restore --source=HEAD -- .github/workflows
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No non-workflow formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: normalize framework formatting"
          git push
