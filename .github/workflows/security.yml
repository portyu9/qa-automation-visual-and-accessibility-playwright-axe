name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 3'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.20.0
  NPM_VERSION: 11.19.1

jobs:
  supply-chain-policy:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate immutable Actions and repository-owned evidence policy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v${NODE_VERSION}" ]]
          node scripts/validate-workflow-pins.mjs
          node --check scripts/validate-security-evidence.mjs
          node --check scripts/validate-playwright-evidence.mjs

  codeql:
    name: CodeQL
    needs: [supply-chain-policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  npm-audit:
    name: npm audit
    needs: [supply-chain-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Pin and verify npm runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v${NODE_VERSION}" ]]
          npm install --global --ignore-scripts --no-audit --no-fund "npm@${NPM_VERSION}"
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
      - name: Install reviewed dependency graph
        run: npm ci --ignore-scripts
      - name: Audit npm dependency graph at HIGH/CRITICAL severity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security/npm
          set +e
          npm audit --audit-level=high --json > reports/security/npm/audit.json
          audit_status=$?
          set -e
          node scripts/validate-security-evidence.mjs npm-audit reports/security/npm/audit.json
          node - <<'NODE' | tee reports/security/npm/summary.md >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('reports/security/npm/audit.json', 'utf8'));
          const dependencies = report.metadata.dependencies;
          const vulnerabilities = report.metadata.vulnerabilities;
          console.log('### npm advisory gate');
          console.log('');
          console.log(`- Dependency graph: ${dependencies.total} total / ${dependencies.dev} development dependencies`);
          console.log(`- Gated advisories: HIGH=${vulnerabilities.high ?? 0}, CRITICAL=${vulnerabilities.critical ?? 0}`);
          console.log(`- npm: ${process.env.NPM_VERSION}`);
          console.log('- Scope: committed lock graph including development dependencies used by Playwright, axe, linting, and type analysis');
          NODE
          exit "$audit_status"
      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-evidence-${{ github.run_id }}
          path: reports/security/npm/
          if-no-files-found: error
          retention-days: 14

  trivy:
    name: Trivy
    needs: [supply-chain-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare evidence directory
        run: mkdir -p reports/security/trivy
      - name: Scan dependencies, configuration, and repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reports/security/trivy/trivy.json
          exit-code: '1'
      - name: Require attributed Trivy evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=reports/security/trivy/trivy.json
          node scripts/validate-security-evidence.mjs trivy "$report"
          npm_packages=$(jq '[.Results[]? | select(.Type == "npm" or ((.Target // "") | contains("package-lock.json"))) | .Packages[]?] | length' "$report")
          playwright_version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          axe_version=$(node -p "require('./package-lock.json').packages['node_modules/@axe-core/playwright'].version")
          {
            echo '### Trivy security gate'
            echo
            echo "- Attributed npm packages: ${npm_packages}"
            echo "- Locked Playwright test runtime: ${playwright_version}"
            echo "- Locked axe Playwright integration: ${axe_version}"
            echo '- Gated HIGH/CRITICAL vulnerabilities: 0'
            echo '- Gated misconfigurations: 0'
            echo '- Gated secret findings: 0'
            echo '- Scanner: Trivy v0.74.0 with development dependencies enabled'
            echo '- Fail-closed: scanner/version evidence, substantive npm inventory, exact governed packages, and zero gated findings are all required'
          } | tee reports/security/trivy/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Trivy security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-security-evidence-${{ github.run_id }}
          path: reports/security/trivy/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    needs: [supply-chain-policy]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe GitHub Dependency graph
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'GitHub Dependency graph is available; running change-aware Dependency Review.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Dependency graph is unavailable; npm Audit and attributed Trivy remain authoritative repository-wide gates, but change-aware Dependency Review cannot run.'
            {
              echo '### Dependency Review fallback'
              echo
              echo 'GitHub Dependency graph is unavailable for this repository, so pull-request diff analysis cannot run.'
              echo 'Independent npm Audit and attributed Trivy remain required repository-wide gates but are not represented as equivalent to change-aware Dependency Review.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Confirm repository-wide fallback gates
        if: steps.dependency-graph.outputs.available != 'true'
        run: echo 'Dependency Review service unavailable; npm Audit and attributed Trivy remain independent required jobs.'

  security-gate:
    name: security-gate
    if: always()
    needs: [supply-chain-policy, codeql, npm-audit, trivy, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate security jobs
        env:
          SUPPLY_CHAIN: ${{ needs.supply-chain-policy.result }}
          CODEQL: ${{ needs.codeql.result }}
          NPM_AUDIT: ${{ needs.npm-audit.result }}
          TRIVY: ${{ needs.trivy.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          EVENT: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPPLY_CHAIN" == "success" ]] || { echo "supply-chain-policy=$SUPPLY_CHAIN"; exit 1; }
          [[ "$NPM_AUDIT" == "success" ]] || { echo "npm-audit=$NPM_AUDIT"; exit 1; }
          [[ "$TRIVY" == "success" ]] || { echo "trivy=$TRIVY"; exit 1; }

          if [[ "$EVENT" == "pull_request" && "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            [[ "$CODEQL" == "skipped" ]] || { echo "fork-codeql=$CODEQL"; exit 1; }
          else
            [[ "$CODEQL" == "success" ]] || { echo "codeql=$CODEQL"; exit 1; }
          fi

          if [[ "$EVENT" == "pull_request" ]]; then
            [[ "$DEPENDENCY_REVIEW" == "success" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW"; exit 1; }
          else
            [[ "$DEPENDENCY_REVIEW" == "skipped" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW"; exit 1; }
          fi
