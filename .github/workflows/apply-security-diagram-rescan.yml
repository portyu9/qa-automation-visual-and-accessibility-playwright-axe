name: apply-security-diagram-rescan

on:
  push:
    branches: [docs/security-diagram-rescan]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/security-diagram-rescan
      - name: Align security architecture with required supply-chain policy
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('| Supply chain | CodeQL, npm Audit, Trivy, Dependency Review | Independent source/dependency/configuration/secret risk signals | Absence of every possible vulnerability |', '| Supply chain | Supply-chain policy + CodeQL, npm Audit, Trivy, Dependency Review | Independent workflow/source/dependency/configuration/secret risk signals | Absence of every possible vulnerability |'),
              ('    SAST[CodeQL] --> SG[Security / security-gate]\n', '    SUPPLY[Supply-chain policy] --> SG[Security / security-gate]\n    SAST[CodeQL] --> SG\n'),
              ('    class STATIC,SAST,AUDIT,TRIVY,REVIEW,SG security;\n', '    class STATIC,SUPPLY,SAST,AUDIT,TRIVY,REVIEW,SG security;\n'),
              ('| Supply chain | CodeQL, npm Audit, Trivy and Dependency Review remain independent controls. |', '| Supply chain | Workflow policy, CodeQL, npm Audit, Trivy and Dependency Review remain independent controls. |'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one Visual security fragment: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit README correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --check
          git commit -m 'docs: show supply-chain policy in security architecture'
          git push origin HEAD:docs/security-diagram-rescan
