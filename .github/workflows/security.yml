name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 3'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.20.0

jobs:
  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe GitHub Dependency graph
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'GitHub Dependency graph is available; running change-aware Dependency Review.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Dependency graph is unavailable; using a high-severity npm audit fallback. Enable Dependency graph to restore change-aware Dependency Review.'
            {
              echo '### Dependency Review fallback'
              echo
              echo 'GitHub Dependency graph is unavailable for this repository, so change-aware Dependency Review cannot run.'
              echo 'This job is using `npm audit --audit-level=high` as a fail-closed fallback. Enable Dependency graph in repository security settings for the stronger pull-request diff analysis.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Set up Node.js for fallback audit
        if: steps.dependency-graph.outputs.available != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install fallback dependency graph
        if: steps.dependency-graph.outputs.available != 'true'
        run: npm ci --ignore-scripts
      - name: Audit fallback dependencies
        if: steps.dependency-graph.outputs.available != 'true'
        run: npm audit --audit-level=high
