name: audit-pin-node-types

on:
  push:
    branches:
      - audit/bind-node-type-surface

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/bind-node-type-surface
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Pin npm runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.1
          [[ "$(npm --version)" == "11.19.1" ]]
      - name: Synchronize committed Node 24 type surface
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact --ignore-scripts @types/node@24.13.3
          node -e "const p=require('./package.json'); if (p.devDependencies['@types/node'] !== '24.13.3') process.exit(1)"
          node -e "const l=require('./package-lock.json'); if (l.packages[''].devDependencies['@types/node'] !== '24.13.3' || l.packages['node_modules/@types/node'].version !== '24.13.3') process.exit(1)"
      - name: Commit generated manifest and lock changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Node type surface already synchronized'
            exit 0
          fi
          git commit -m 'deps: align Node declarations with Node 24 runtime'
          git push origin HEAD:audit/bind-node-type-surface
