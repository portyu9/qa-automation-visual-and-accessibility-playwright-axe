name: audit-format

on:
  push:
    branches:
      - audit/bind-node-runtime-policy

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/bind-node-runtime-policy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format audit-owned sources
        run: npx prettier --write scripts/validate-docs.mjs scripts/validate-runtime-policy.mjs
      - name: Commit formatter output only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/validate-docs.mjs scripts/validate-runtime-policy.mjs; then
            echo 'formatter output already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-docs.mjs scripts/validate-runtime-policy.mjs
          git commit -m 'style: format runtime policy sources'
          git push origin HEAD:audit/bind-node-runtime-policy
