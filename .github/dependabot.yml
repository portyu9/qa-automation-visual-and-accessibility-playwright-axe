version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 10
    versioning-strategy: increase
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      playwright-and-axe:
        patterns:
          - '@playwright/*'
          - '@axe-core/*'
      typescript-linting:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - '@eslint/*'
          - 'eslint'
      formatting-and-types:
        patterns:
          - 'prettier'
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:20'
      timezone: America/New_York
    open-pull-requests-limit: 10
