name: format-probe

on:
  pull_request:
    paths:
      - '.github/scripts/dependency-governance.mjs'
      - '.github/workflows/format-probe.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Emit repository-canonical formatting as JSON
        run: |
          npx prettier .github/scripts/dependency-governance.mjs > /tmp/dependency-governance.formatted.mjs
          node -e "const fs=require('node:fs'); console.log('FORMATTED_JSON='+JSON.stringify(fs.readFileSync('/tmp/dependency-governance.formatted.mjs','utf8')))"
