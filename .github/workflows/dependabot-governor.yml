name: dependabot-governor

on:
  workflow_run:
    workflows: [ci, security]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Dependabot pull request number to re-evaluate
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/dependabot-governor.yml
      - .github/scripts/dependabot_governor.py
      - .github/dependabot.yml

permissions: {}

concurrency:
  group: dependabot-governor-${{ github.event.workflow_run.head_branch || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python .github/scripts/dependabot_governor.py --self-test

  govern:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GOVERNOR_REQUIRED_WORKFLOWS: ".github/workflows/ci.yml,.github/workflows/security.yml"
      GOVERNOR_ALLOWED_GROUPS: "playwright-and-axe,typescript-linting,formatting-and-types,routine-actions"
      GOVERNOR_ALLOWED_UPDATE_TYPES: "version-update:semver-patch,version-update:semver-minor,security-update:semver-patch,security-update:semver-minor"
      GOVERNOR_BLOCK_LABELS: "manual-review,do-not-merge"
      GOVERNOR_MERGE_METHOD: "merge"
      GOVERNOR_MANUAL_REVIEW_PATHS: |
        .github/workflows/security.yml
        .github/workflows/dependabot-governor.yml
        .github/dependabot.yml
        .github/scripts/dependabot_governor.py
      GOVERNOR_ALLOWED_PATHS: |
        package.json
        package-lock.json
        npm-shrinkwrap.json
        .github/workflows/*.yml
        .github/workflows/*.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.repository.default_branch }}"
      - run: python .github/scripts/dependabot_governor.py --self-test
      - run: python .github/scripts/dependabot_governor.py
