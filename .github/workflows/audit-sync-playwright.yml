name: audit-sync-playwright

on:
  push:
    branches:
      - deps/playwright-1.63.0

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deps/playwright-1.63.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Pin npm runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.1
          [[ "$(npm --version)" == "11.19.1" ]]
      - name: Synchronize Playwright packages atomically
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact --ignore-scripts @playwright/test@1.63.0 playwright-core@1.63.0
          node - <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          if (p.devDependencies['@playwright/test'] !== '1.63.0') process.exit(1);
          if (p.devDependencies['playwright-core'] !== '1.63.0') process.exit(1);
          if (l.packages['node_modules/@playwright/test']?.version !== '1.63.0') process.exit(1);
          if (l.packages['node_modules/playwright-core']?.version !== '1.63.0') process.exit(1);
          if (l.packages['node_modules/playwright/node_modules/playwright-core']) {
            console.error('unexpected nested playwright-core; atomic update must deduplicate to one core version');
            process.exit(1);
          }
          NODE
      - name: Commit generated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Playwright graph already synchronized'
            exit 0
          fi
          git commit -m 'deps: update Playwright packages to 1.63.0'
          git push origin HEAD:deps/playwright-1.63.0
