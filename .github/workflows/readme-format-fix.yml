name: readme-format-fix

on: [push]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/readme-knowledge
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write README.md
      - run: npm run format:check
      - run: npm run docs:check
      - name: Commit formatted README
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/readme-format-fix.yml
          git add README.md
          git commit -m 'docs: format README knowledge section'
          git push origin HEAD:docs/readme-knowledge
