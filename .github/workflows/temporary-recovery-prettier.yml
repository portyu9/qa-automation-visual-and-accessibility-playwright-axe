# Temporary branch-only formatting job; remove before merging.
name: temporary-recovery-prettier
on:
  push:
    branches:
      - 'feat/signed-actions-fallback-20261117'
    paths:
      - '.github/workflows/temporary-recovery-prettier.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/signed-actions-fallback-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'feat/signed-actions-fallback-20261117'
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Format exact governed files without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prettier --write \
            .github/dependency-governance.json \
            .github/scripts/dependency-governance.mjs \
            .github/scripts/dependency-stale-fallback.mjs \
            .github/scripts/dependency-stale-fallback.selfcheck.mjs
          git add -- \
            .github/dependency-governance.json \
            .github/scripts/dependency-governance.mjs \
            .github/scripts/dependency-stale-fallback.mjs \
            .github/scripts/dependency-stale-fallback.selfcheck.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style(governance): apply repository Prettier to verified Docker recovery'
            git push origin HEAD:feat/signed-actions-fallback-20261117
          fi
