name: Visual Baseline

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.20.0

jobs:
  baseline:
    name: generate-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate canonical snapshots
        run: npm run visual:update
      - name: Verify canonical snapshots
        run: npm run test:visual
      - name: Assert baseline set is non-empty
        shell: bash
        run: |
          set -euo pipefail
          if ! find tests/__screenshots__ -type f -name '*.png' -print -quit | grep -q .; then
            echo "::error::Visual suite produced no PNG snapshots."
            exit 1
          fi
      - name: Upload canonical visual baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines-linux-chromium
          path: tests/__screenshots__/
          if-no-files-found: error
          retention-days: 90
      - name: Upload baseline verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baseline-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
