name: one-shot-prettier-remediation

on:
  push:
    branches: [security/fix-recovery-redos]
    paths:
      - '.github/workflows/one-shot-prettier-remediation.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/security/fix-recovery-redos'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/fix-recovery-redos
          fetch-depth: 1
      - name: Apply repository formatter
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prettier --write .github/scripts/dependency-recovery-policy.mjs .github/scripts/dependency-recovery-policy.selfcheck.mjs
          rm .github/workflows/one-shot-prettier-remediation.yml
          git diff --check
          ./node_modules/.bin/prettier --check .github/scripts/dependency-recovery-policy.mjs .github/scripts/dependency-recovery-policy.selfcheck.mjs
          node --test .github/scripts/dependency-recovery-policy.selfcheck.mjs
      - name: Commit formatter delta and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/dependency-recovery-policy.mjs .github/scripts/dependency-recovery-policy.selfcheck.mjs .github/workflows/one-shot-prettier-remediation.yml
          git commit -m 'style: format ReDoS remediation'
          git push origin HEAD:security/fix-recovery-redos
