name: Visual Baseline

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.20.0
  NPM_VERSION: 11.19.1

jobs:
  baseline:
    name: generate-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Pin npm runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate canonical snapshots
        run: npm run visual:update
      - name: Verify canonical snapshots
        run: npm run test:visual
      - name: Validate visual execution evidence
        run: node scripts/validate-playwright-evidence.mjs test-results/junit.xml playwright-report/index.html 12 visual/ chromium,mobile-chromium
      - name: Assert baseline set is meaningful
        shell: bash
        run: |
          set -euo pipefail
          snapshot_count="$(find tests/__screenshots__ -type f -name '*.png' | wc -l | tr -d ' ')"
          if [[ "$snapshot_count" -lt 12 ]]; then
            echo "::error::Visual suite produced only ${snapshot_count} PNG snapshots; expected at least 12 governed desktop/mobile baselines."
            exit 1
          fi
          echo "Validated ${snapshot_count} canonical PNG snapshots."
      - name: Upload canonical visual baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines-linux-chromium
          path: tests/__screenshots__/
          if-no-files-found: error
          retention-days: 90
      - name: Upload baseline verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baseline-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
