name: normalize-versionless-docs
on:
  push:
    branches: [chore/versionless-docs]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Normalize and validate documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/normalize-versionless-docs.py
          node scripts/validate-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/doc-version-normalize.yml .github/scripts/normalize-versionless-docs.py
          git add -A
          git diff --cached --check
          git commit -m "docs: make technology documentation versionless"
          git push origin HEAD
