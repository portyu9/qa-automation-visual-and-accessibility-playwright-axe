name: audit-format-runtime-policy

on:
  push:
    branches:
      - audit/bind-node-type-surface

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/bind-node-type-surface
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Pin npm runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.1
          [[ "$(npm --version)" == "11.19.1" ]]
      - name: Install committed graph and format policy
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write scripts/validate-runtime-policy.mjs
          npx prettier --check scripts/validate-runtime-policy.mjs
          git diff --check
      - name: Commit formatter result when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-runtime-policy.mjs
          if git diff --cached --quiet; then
            echo 'Runtime policy already formatted'
            exit 0
          fi
          git commit -m 'style: format runtime policy validator'
          git push origin HEAD:audit/bind-node-type-surface
